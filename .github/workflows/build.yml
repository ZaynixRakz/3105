name: ZaynixFile Pure Patcher Final
on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and Inject Rebrand
        run: |
          mkdir -p build/Payload
          
          # 1. Mengunduh IPA resmi 3105 yang stabil dan matang langsung dari server rilis GitHub
          curl -L -o basis_aplikasi.ipa "https://github.com"
          
          # 2. Ekstrak isi berkas IPA tersebut
          unzip -q basis_aplikasi.ipa -d ekstrak_data
          
          # 3. Pindahkan folder aplikasinya ke folder Payload baru kita
          cp -r ekstrak_data/Payload/*.app build/Payload/ZaynixFile.app
          
          # 4. Suntikkan konfigurasi nama baru ZaynixFile secara permanen ke sistem Info.plist
          cd build/Payload/ZaynixFile.app
          chmod +w Info.plist
          
          # Gunakan perintah python bawaan Linux untuk mengganti nama aplikasi secara akurat tanpa merusak file biner
          python3 -c '
          import plistlib
          with open("Info.plist", "rb") as f:
              pl = plistlib.load(f)
          pl["CFBundleDisplayName"] = "ZaynixFile"
          pl["CFBundleName"] = "ZaynixFile"
          with open("Info.plist", "wb") as f:
              plistlib.dump(pl, f)
          '
          
      - name: Package to Real IPA
        run: |
          cd build
          # Membungkus kembali seluruh folder biner utuh menjadi file .IPA matang
          zip -qy -r ZaynixFile_Fix_Total.ipa Payload
          
      - name: Upload Real Sized IPA
        uses: actions/upload-artifact@v4
        with:
          name: ZaynixFile_Matang_Siap_Instal
          path: build/ZaynixFile_Fix_Total.ipa
          
