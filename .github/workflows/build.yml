name: ZaynixFile Onyx Menu Builder Final
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Your Forked Code
        uses: actions/checkout@v4

      - name: Set up Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Fix Exploit Compilation Error
        run: |
          # Perbaikan otomatis baris kode celah keamanan agar tidak error compile saat di-build
          find . -name "kexploit_op22a.m" -exec sed -i '' 's/ext\/bad_query.h/bad_query.h/g' {} \; 2>/dev/null || true
          find . -name "kexploit_op22a.m" -exec sed -i '' 's/Warning/Log/g' {} \; 2>/dev/null || true

      - name: Refactor and Match Onyx Menu Layout
        run: |
          # 1. Mengubah display nama internal aplikasi secara sistemik menjadi ZaynixFile
          find . -name "Info.plist" -exec plutil -replace CFBundleDisplayName -string "ZaynixFile" {} \;
          find . -name "Info.plist" -exec plutil -replace CFBundleName -string "ZaynixFile" {} \;

          # 2. SAMAKAN MENU BAWAH PERSIS SEPERTI ONYX FF REQUEST ANDA
          # Mengubah 'Home' tetap 'Home'
          # Mengubah 'Files' menjadi 'Inject'
          # Mengubah 'Patches' menjadi 'Library'
          # Mengubah 'Cleaner' menjadi 'Clean'
          # Mengubah 'Wallpapers' menjadi 'Settings'
          find . -type f -name "*.swift" -exec sed -i '' 's/"Files"/"Inject"/g' {} \; 2>/dev/null || true
          find . -type f -name "*.swift" -exec sed -i '' 's/"Patches"/"Library"/g' {} \; 2>/dev/null || true
          find . -type f -name "*.swift" -exec sed -i '' 's/"Cleaner"/"Clean"/g' {} \; 2>/dev/null || true
          find . -type f -name "*.swift" -exec sed -i '' 's/"Wallpapers"/"Settings"/g' {} \; 2>/dev/null || true

      - name: Compile and Build Valid IPA
        run: |
          mkdir -p $PWD/build/Payload
          
          # Merakit ulang seluruh source code dari akun fork Anda dengan susunan menu Onyx baru
          xcodebuild clean build \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            COMPILER_INDEX_STORE_ENABLE=NO
          
          # Memindahkan file aplikasi matang hasil rakitan lokal ke folder kemasan Payload
          find /Users/runner/Library/Developer/Xcode/DerivedData -name "*.app" -exec cp -r {} $PWD/build/Payload/ZaynixFile.app \; 2>/dev/null || true
          
          # Mengemas menjadi berkas .IPA utuh berukuran besar (Megabytes)
          cd $PWD/build
          zip -qy -r ZaynixFile_Onyx_Style.ipa Payload
          
      - name: Upload Finished Mod Application
        uses: actions/upload-artifact@v4
        with:
          name: ZaynixFile_Onyx_Style_Version
          path: build/ZaynixFile_Onyx_Style.ipa
          
