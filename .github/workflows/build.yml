name: ZaynixFile Final Fix Patcher
on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Structure and Rebrand
        run: |
          # 1. Membuat folder pembungkus standar iOS
          mkdir -p build/Payload/ZaynixFile.app
          
          # 2. Menyalin seluruh aset dasar repositori Anda ke dalam kemasan aplikasi
          cp -r * build/Payload/ZaynixFile.app/ 2>/dev/null || true
          
          # 3. Menyuntikkan file identitas nama baru ZaynixFile agar dibaca sistem iPhone
          cd build/Payload/ZaynixFile.app
          echo '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com"><plist version="1.0"><dict><key>CFBundleDisplayName</key><string>ZaynixFile</string><key>CFBundleName</key><string>ZaynixFile</string><key>CFBundleIdentifier</key><string>com.apple.mobile.MobileHouseArrest</string><key>CFBundleVersion</key><string>1.1.0</string><key>CFBundlePackageType</key><string>APPL</string><key>CFBundleShortVersionString</key><string>1.1.0</string><key>MinimumOSVersion</key><string>15.0</string></dict></plist>' > Info.plist
          
      - name: Package to Authentic IPA
        run: |
          cd build
          # Membungkus paket menjadi berkas .IPA matang
          zip -qy -r ZaynixFile_Final_Fix.ipa Payload
          
      - name: Upload Finished Application
        uses: actions/upload-artifact@v4
        with:
          name: ZaynixFile_Siap_Pakai
          path: build/ZaynixFile_Final_Fix.ipa
          
