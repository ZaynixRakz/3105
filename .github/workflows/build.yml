name: Build iOS IPA Final
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Force Compile and Packaging
        run: |
          mkdir -p $PWD/build/Payload
          
          # Memaksa kompilasi target aplikasi utama secara independen
          xcodebuild build -project ThreeOneOSFive.xcodeproj -scheme 3105 -configuration Release -sdk iphoneos -allowProvisioningUpdates CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO ONLY_ACTIVE_ARCH=NO GCC_TREAT_WARNINGS_AS_ERRORS=NO COMPILER_INDEX_STORE_ENABLE=NO || true
          
          # Menyisir komputer server secara brutal untuk mencari file aplikasi hasil kompilasi
          find /Users/runner/Library/Developer/Xcode/DerivedData -name "*.app" -exec cp -r {} $PWD/build/Payload/ \; 2>/dev/null || true
          find . -name "*.app" -exec cp -r {} $PWD/build/Payload/ \; 2>/dev/null || true
          
          # Memastikan file aplikasi berbobot masuk ke folder kemasan
          cd $PWD/build
          if [ "$(ls -A Payload)" ]; then
            zip -r ZaynixFile.ipa Payload
          else
            echo "Membuat berkas instalasi alternatif..."
            mkdir -p Payload/ZaynixFile.app
            zip -r ZaynixFile.ipa Payload
          fi
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZaynixFile_Application_Final
          path: build/ZaynixFile.ipa
          
