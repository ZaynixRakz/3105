name: ZaynixFile Final Rebrand
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Inject Rebrand to Info Plist
        run: |
          # Mengubah display nama internal aplikasi di semua file konfigurasi secara sistemik
          find . -name "Info.plist" -exec plutil -replace CFBundleDisplayName -string "ZaynixFile" {} \;
          find . -name "Info.plist" -exec plutil -replace CFBundleName -string "ZaynixFile" {} \;

      - name: Official Compilation
        run: |
          mkdir -p $PWD/build/Payload
          
          # Kompilasi bersih mendalam untuk menghasilkan file biner aplikasi utuh
          xcodebuild clean archive \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $PWD/build/ZaynixFile.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            COMPILER_INDEX_STORE_ENABLE=NO
          
          # Memindahkan file aplikasi matang (.app) ke dalam folder Payload
          cp -r $PWD/build/ZaynixFile.xcarchive/Products/Applications/*.app $PWD/build/Payload/ 2>/dev/null || cp -r /Users/runner/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphoneos/*.app $PWD/build/Payload/
          
          # Mengemas aplikasi utuh menjadi file .IPA matang
          cd $PWD/build
          zip -qy -r ZaynixFile_Final.ipa Payload
          
      - name: Upload Valid IPA
        uses: actions/upload-artifact@v4
        with:
          name: ZaynixFile_Siap_Instal
          path: build/ZaynixFile_Final.ipa
          
