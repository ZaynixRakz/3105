name: ZaynixFile Perfect Custom Build Final
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Setup Workspace Directories
        run: |
          mkdir -p build/Payload
          mkdir -p raw_app

      - name: Download Stable Base Application
        run: |
          # Mengunduh paket rilis resmi lewat jalur stabil GitHub API cermin
          curl -L -o raw_app/ThreeOneOSFive.zip "https://github.com"
          
          # Proses pembongkaran aman
          cd raw_app
          unzip -o ThreeOneOSFive.zip
          cp -r ThreeOneOSFive.app ../build/Payload/ZaynixFile.app

      - name: Hard Patch Navigation and Names
        run: |
          cd build/Payload/ZaynixFile.app
          
          # 1. Mengganti nama visual aplikasi menjadi ZaynixFile pada manifes utama
          if [ -f "Info.plist" ]; then
            plutil -replace CFBundleDisplayName -string "ZaynixFile" Info.plist
            plutil -replace CFBundleName -string "ZaynixFile" Info.plist
            plutil -replace CFBundleIdentifier -string "com.apple.mobile.MobileHouseArrest" Info.plist
          fi

          # 2. Mengubah teks navigasi bawah secara langsung ke dalam biner inti aplikasi
          if [ -f "ThreeOneOSFive" ]; then
            chmod +x ThreeOneOSFive
            sed -i '' 's/Files/Inject/g' ThreeOneOSFive 2>/dev/null || true
            sed -i '' 's/Patches/Library/g' ThreeOneOSFive 2>/dev/null || true
            sed -i '' 's/Cleaner/Clean\  /g' ThreeOneOSFive 2>/dev/null || true
            sed -i '' 's/Wallpapers/Settings\  /g' ThreeOneOSFive 2>/dev/null || true
          fi

      - name: Re-Package to iOS IPA
        run: |
          cd build
          zip -qy -r ZaynixFile_Merek_Saya.ipa Payload

      - name: Upload Valid Mod Application
        uses: actions/upload-artifact@v4
        with:
          name: ZaynixFile_Hasil_Akhir_Merek
          path: build/ZaynixFile_Merek_Saya.ipa
          
