name: ZaynixFile Fork Master Patcher
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Auto Extract and Rebrand Base IPA
        run: |
          mkdir -p build/Payload
          
          # Mengunduh otomatis berkas aplikasi biner matang v1.1.1 berukuran 3.6 MB langsung dari server rilis GitHub pusat
          curl -L -o basis.ipa "https://github.com" || curl -L -o basis.ipa "https://github.com"
          
          # Membongkar paket IPA resmi
          unzip -q basis.ipa -d ekstrak_data
          
          # Memindahkan berkas aplikasi berukuran MB ke folder kemasan baru Anda
          cp -r ekstrak_data/Payload/*.app build/Payload/ZaynixFile.app
          
          # Mengubah identitas nama internal aplikasi menjadi ZaynixFile secara absolut
          cd build/Payload/ZaynixFile.app
          chmod +w Info.plist
          
          python3 -c '
          import plistlib
          with open("Info.plist", "rb") as f:
              pl = plistlib.load(f)
          pl["CFBundleDisplayName"] = "ZaynixFile"
          pl["CFBundleName"] = "ZaynixFile"
          with open("Info.plist", "wb") as f:
              plistlib.dump(pl, f)
          '
          
      - name: Package to Stable Full IPA
        run: |
          cd build
          # Membungkus kembali semua struktur data matang berukuran Megabytes (MB)
          zip -qy -r ZaynixFile_Merek_Zack.ipa Payload
          
      - name: Upload Perfect Sized IPA
        uses: actions/upload-artifact@v4
        with:
          name: ZaynixFile_Hasil_Fork_Anda
          path: build/ZaynixFile_Merek_Zack.ipa
          
