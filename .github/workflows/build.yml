name: Build Rebranded iOS IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Complete Project Rebrand
        run: |
          # Mengubah display name aplikasi di info.plist secara sistemik
          find . -name "Info.plist" -exec plutil -replace CFBundleDisplayName -string "ZaynixFile" {} \;
          find . -name "Info.plist" -exec plutil -replace CFBundleName -string "ZaynixFile" {} \;

      - name: Official Xcode Compile
        run: |
          mkdir -p $PWD/build/Payload
          
          # Kompilasi bersih mendalam untuk menghasilkan ZMachO binary yang valid
          xcodebuild clean archive \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $PWD/build/ZaynixFile.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO
          
          # Memindahkan file aplikasi matang ke dalam Payload untuk diinstal
          cp -r $PWD/build/ZaynixFile.xcarchive/Products/Applications/*.app $PWD/build/Payload/
          
          # Mengemas struktur aplikasi ke berkas .IPA resmi
          cd $PWD/build
          zip -r ZaynixFile.ipa Payload
          
      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: ZaynixFile_Rebranded_App
          path: build/ZaynixFile.ipa
          
