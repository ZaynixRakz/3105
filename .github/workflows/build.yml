name: ZaynixFile Perfect Build Final
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fetch Official Binary and Inject Rebrand
        run: |
          mkdir -p build/Payload
          
          # 1. Mengunduh file resmi 1.1.1 berukuran 3.6 MB langsung dari server rilis resmi GitHub
          curl -L -o basis_aplikasi.ipa "https://github.com"
          
          # 2. Ekstrak paket aplikasinya secara aman
          unzip -q basis_aplikasi.ipa -d ekstrak_data
          
          # 3. Memindahkan seluruh komponen biner 3.6 MB ke folder kemasan baru Anda
          cp -r ekstrak_data/Payload/*.app build/Payload/ZaynixFile.app
          
          # 4. Menyuntikkan konfigurasi nama baru ZaynixFile langsung ke sistem internal aplikasi
          cd build/Payload/ZaynixFile.app
          chmod +w Info.plist
          
          python3 -c '
          import plistlib
          with open("Info.plist", "rb") as f:
              pl = plistlib.load(f)
          pl["CFBundleDisplayName"] = "ZaynixFile"
          pl["CFBundleName"] = "ZaynixFile"
          with open("Info.plist", "wb") as f:
              plistlib.dump(pl, f)
          '
          
      - name: Package to Stable Full IPA
        run: |
          cd build
          # Membungkus kembali semua struktur data matang menjadi file .IPA utuh
          zip -qy -r ZaynixFile_Merek_Zack.ipa Payload
          
      - name: Upload Perfect Sized IPA
        uses: actions/upload-artifact@v4
        with:
          name: ZaynixFile_Merek_Zack_Final
          path: build/ZaynixFile_Merek_Zack.ipa
          
