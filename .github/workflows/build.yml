name: ZaynixFile Perfect Custom Build Final
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Forked Repository
        uses: actions/checkout@v4

      - name: Set up Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Hard Patch Navigation and Names
        run: |
          # 1. Mengganti Nama Tampilan Aplikasi Menjadi ZaynixFile di Sistem Konfigurasi PLIST
          find . -name "Info.plist" -exec plutil -replace CFBundleDisplayName -string "ZaynixFile" {} \;
          find . -name "Info.plist" -exec plutil -replace CFBundleName -string "ZaynixFile" {} \;

          # 2. Menyisir Teks Navigasi Bar Bawah Otomatis Agar Berubah Sesuai Keinginan Anda
          find . -type f -name "*.swift" -exec sed -i '' 's/"Files"/"Inject"/g' {} \; 2>/dev/null || true
          find . -type f -name "*.swift" -exec sed -i '' 's/"Patches"/"Library"/g' {} \; 2>/dev/null || true
          find . -type f -name "*.swift" -exec sed -i '' 's/"Cleaner"/"Clean"/g' {} \; 2>/dev/null || true
          find . -type f -name "*.swift" -exec sed -i '' 's/"Wallpapers"/"Settings"/g' {} \; 2>/dev/null || true

      - name: Force Framework Packaging
        run: |
          mkdir -p build/Payload
          
          # 3. Merakit Struktur Aplikasi Menggunakan Mesin iOS SDK Tanpa Proteksi Kode Dokumen
          xcodebuild build \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            COMPILER_INDEX_STORE_ENABLE=NO
          
          # 4. Melacak dan Mengambil File Hasil Rakitan .app yang Resmi Terbentuk
          find /Users/runner/Library/Developer/Xcode/DerivedData -name "*.app" -exec cp -r {} build/Payload/ZaynixFile.app \; 2>/dev/null || true
          
          # 5. Membungkus Hasil Akhir Menjadi Berkas Mentahan .ipa iOS
          cd build
          if [ -d "Payload/ZaynixFile.app" ]; then
            zip -qy -r ZaynixFile_Merek_Saya.ipa Payload
          else
            echo "Kompilasi Gagal: Berkas aplikasi tidak ditemukan di DerivedData."
            exit 1
          fi

      - name: Upload Valid Mod Application
        uses: actions/upload-artifact@v4
        with:
          name: ZaynixFile_Hasil_Akhir_Merek
          path: build/ZaynixFile_Merek_Saya.ipa
          
